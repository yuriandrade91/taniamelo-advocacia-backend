# Mensagens padrão do Bean Validation em PT-BR.
#
# O Hibernate Validator lê este arquivo da raiz do classpath e ele substitui os textos
# embutidos, que vêm em inglês ("size must be between 0 and 255"). Sem isto, a API
# respondia erro de validação metade em português (as mensagens escritas à mão nos DTOs)
# e metade em inglês (as padrão) - e a tela mostra o que vier.
#
# Um arquivo, e não `message = "..."` em cada anotação: são dezenas de @Size, e a próxima
# nasceria em inglês de novo.
jakarta.validation.constraints.NotNull.message          = Campo obrigatório.
jakarta.validation.constraints.NotBlank.message         = Campo obrigatório.
jakarta.validation.constraints.NotEmpty.message         = Campo obrigatório.
jakarta.validation.constraints.Size.message             = Tamanho inválido: use entre {min} e {max} caracteres.
jakarta.validation.constraints.Email.message            = E-mail inválido.
jakarta.validation.constraints.Past.message             = A data precisa estar no passado.
jakarta.validation.constraints.PastOrPresent.message    = A data não pode estar no futuro.
jakarta.validation.constraints.Future.message           = A data precisa estar no futuro.
jakarta.validation.constraints.FutureOrPresent.message  = A data não pode estar no passado.
jakarta.validation.constraints.Min.message              = Valor mínimo: {value}.
jakarta.validation.constraints.Max.message              = Valor máximo: {value}.
jakarta.validation.constraints.DecimalMin.message       = Valor mínimo: {value}.
jakarta.validation.constraints.DecimalMax.message       = Valor máximo: {value}.
jakarta.validation.constraints.Positive.message         = Precisa ser maior que zero.
jakarta.validation.constraints.PositiveOrZero.message   = Não pode ser negativo.
jakarta.validation.constraints.Pattern.message          = Formato inválido.
jakarta.validation.constraints.AssertTrue.message       = Condição não atendida.

# DevTools restart classloader excludes
# Generated MapStruct sources should NOT be in the restart classloader;
# they should be loaded by the base classloader to avoid class resolution issues.
# Use regex patterns (not ant-style) for DevTools exclude patterns.
restart.exclude.mapstruct=/target/generated-sources/annotations/.*
restart.exclude.mapstruct-classes=/target/classes/com/lawfirm/law/firm/dto/.*MapperImpl\\.class

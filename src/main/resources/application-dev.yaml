spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lawfirm}
    username: ${SPRING_DATASOURCE_USERNAME:lawuser}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway owns the schema; Hibernate only validates the mapping matches it.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway automático desligado: as migrations são aplicadas por schema pelo
  # MultiTenantFlywayMigrator (multi-tenancy por schema). Não reative aqui, senão
  # o Spring rodaria as migrations flat no schema errado.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

# Useful defaults for local development
spring.main:
  allow-bean-definition-overriding: true

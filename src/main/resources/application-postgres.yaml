spring:
  application:
    name: law-firm
  # Mesmo padrão de application.yaml: credencial por variável de ambiente, com
  # default só para o Postgres do docker-compose local. Como este arquivo é o
  # profile usado no deploy real (ver docs/AWS_EC2_ARM64_DEPLOY.md), tê-la fixa
  # aqui - mesmo sobrescrita pela env var em runtime - é o tipo de coisa que o
  # scanner de segredos do Sonar aponta com razão: parece credencial real.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/system}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway is the single source of truth for schema in every profile - Hibernate only
    # validates that entity mappings match what migrations produced. Never 'update'/'create'
    # here: that would let Hibernate silently alter schema outside of migration history.
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  jmx:
    enabled: false

server:
  port: 8080

# springdoc config lives in application.yaml (base) so it applies to every profile;
# no need to repeat/override it here.

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Law Firm API - Swagger UI (legacy path)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.18.3/swagger-ui.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; }*, *:before, *:after { box-sizing: inherit; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.18.3/swagger-ui-bundle.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    window.onload = function() {
      // Force the UI to load the existing openapi.json placed at /api/docs/openapi.json
      const specUrl = '/api/docs/openapi.json';
      const ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout"
      });
      window.ui = ui;

      (function appendLiveReloadScript() {
        try {
          var script = document.createElement('script');
          script.src = 'http://localhost:35729/livereload.js?snipver=1';
          script.async = true;
          script.onload = function() { console.info('LiveReload script loaded'); };
          script.onerror = function() { /* no-op if not available */ };
          document.head.appendChild(script);
        } catch (e) {
          // ignore
        }
      })();
    };
  </script>
</body>
</html>

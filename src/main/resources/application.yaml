spring:
  application:
    name: law-firm
  datasource:
    url: jdbc:postgresql://localhost:5432/system
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jmx:
    enabled: false

  # baseline-on-migrate only matters for a non-empty schema that has no
  # flyway_schema_history table yet (e.g. one specific dev DB that had its schema
  # created by hand before Flyway was wired up). It's a one-time, per-environment
  # bootstrap step - it must NOT be a permanent default, or a teammate's/CI's fresh,
  # empty database would silently skip running V1..V4 the moment they enable it.
  # Leave disabled here; turn it on only via env vars on the one environment that
  # needs it (see README "Adotando o Flyway em um banco já existente").
  flyway:
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}

  # Dev resources: avoid caching static resources so LiveReload changes appear immediately
  web:
    resources:
      cache:
        period: 0
      static-locations: classpath:/static/

  # Limites do upload de documentos/simulações de CNIS. max-request-size é maior
  # que max-file-size porque o upload em lote manda vários arquivos numa única
  # requisição multipart.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
    # No tags-sorter: Swagger UI then renders tags in the order they appear
    # in the OpenAPI document, which OpenApiConfig#orderedTags fixes to
    # auth -> clientes -> endereços -> arquivos -> entrevista -> financeiro.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # MUST be overridden via APP_JWT_SECRET (32+ chars) outside of local dev.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32chars}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  admin:
    # Seed credentials for the first ADMIN user, created automatically if the users table is empty.
    email: ${APP_ADMIN_EMAIL:admin@taniamelo.adv.br}
    password: ${APP_ADMIN_PASSWORD:changeme123}
  storage:
    # "local" é a única implementação hoje (LocalDiskFileStorageService). Trocar
    # para S3 no futuro é criar S3FileStorageService e mudar só esta config -
    # nenhuma entidade/DTO/service muda, todos dependem de FileStorageService.
    type: ${APP_STORAGE_TYPE:local}
    local:
      # Em docker-compose isto é montado como volume nomeado (ver app-storage)
      # para sobreviver a rebuilds da imagem.
      base-path: ${APP_STORAGE_LOCAL_PATH:./storage}
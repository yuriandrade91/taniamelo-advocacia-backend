spring:
  application:
    name: law-firm
  datasource:
    url: jdbc:postgresql://localhost:5432/system
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jmx:
    enabled: false

  # baseline-on-migrate only matters for a non-empty schema that has no
  # flyway_schema_history table yet (e.g. one specific dev DB that had its schema
  # created by hand before Flyway was wired up). It's a one-time, per-environment
  # bootstrap step - it must NOT be a permanent default, or a teammate's/CI's fresh,
  # empty database would silently skip running V1..V4 the moment they enable it.
  # Leave disabled here; turn it on only via env vars on the one environment that
  # needs it (see README "Adotando o Flyway em um banco já existente").
  # Flyway automático DESLIGADO: com multi-tenancy por schema, as migrations são
  # aplicadas por schema pelo MultiTenantFlywayMigrator (db/migration/shared no
  # public + db/migration/tenant em cada schema). Ver com.lawfirm.law.firm.tenant.
  flyway:
    enabled: false

  # Dev resources: avoid caching static resources so LiveReload changes appear immediately
  web:
    resources:
      cache:
        period: 0
      static-locations: classpath:/static/

  # Limites do upload de documentos/simulações de CNIS. max-request-size é maior
  # que max-file-size porque o upload em lote manda vários arquivos numa única
  # requisição multipart.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
    # No tags-sorter: Swagger UI then renders tags in the order they appear
    # in the OpenAPI document, which OpenApiConfig#orderedTags fixes to
    # auth -> clientes -> endereços -> arquivos -> entrevista -> financeiro.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # MUST be overridden via APP_JWT_SECRET (32+ chars) outside of local dev.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32chars}
    # TTL do access token (JWT no header). Com refresh token ativo, pode ser curto.
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
    # TTL do refresh token (cookie httpOnly). Rotacionado a cada /auth/refresh.
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:14}
  # Multi-tenancy por schema. Cada tenant = um schema Postgres autocontido.
  # O identificador do tenant é o próprio nome do schema; o frontend informa via
  # cabeçalho X-Tenant-Id (necessário no login). Só schemas listados são aceitos.
  tenancy:
    default-schema: ${APP_TENANCY_DEFAULT_SCHEMA:tenant_tania}
    schemas: ${APP_TENANCY_SCHEMAS:tenant_tania,tenant_demo}
    header-name: ${APP_TENANCY_HEADER:X-Tenant-Id}
  # Cookie do refresh token. Em produção com front em outro domínio:
  # secure=true e same-site=None. Em dev local (http, mesma origem): Lax/false.
  auth:
    refresh-cookie:
      name: ${APP_AUTH_REFRESH_COOKIE_NAME:refreshToken}
      path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAMESITE:Lax}
  admin:
    # Seed credentials for the first ADMIN user, created automatically if the users table is empty.
    email: ${APP_ADMIN_EMAIL:admin@taniamelo.adv.br}
    password: ${APP_ADMIN_PASSWORD:changeme123}
  # CORS: origens permitidas separadas por vírgula. Default "*" para dev local
  # não travar; na AWS defina APP_CORS_ALLOWED_ORIGINS com o domínio do frontend
  # (ex.: https://app.taniamelo.adv.br).
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  storage:
    # "local" (padrão) usa LocalDiskFileStorageService; "s3" usa ObjectStorageFileStorageService.
    # Só esta propriedade muda ao trocar de disco local para S3 - nenhuma
    # entidade/DTO/service/controller é alterado (todos dependem de FileStorageService).
    type: ${APP_STORAGE_TYPE:local}
    local:
      # Em docker-compose isto é montado como volume nomeado (ver app-storage)
      # para sobreviver a rebuilds da imagem.
      base-path: ${APP_STORAGE_LOCAL_PATH:./storage}
    s3:
      # Usados apenas quando type=s3. bucket e region são obrigatórios nesse caso.
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:sa-east-1}
      # endpoint vazio = AWS real; preencha só para LocalStack/MinIO em teste.
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      # path-style: true só para LocalStack/MinIO; na AWS real deixe false.
      path-style-access: ${APP_STORAGE_S3_PATH_STYLE:false}
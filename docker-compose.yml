version: "3.8"

services:
  db:
    container_name: database-postgress
    image: postgres:17.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  # No separate flyway service: the app owns migrations itself via
  # spring-boot-starter-flyway, running them once on startup before serving traffic.
  # Having both a standalone flyway container and the app run migrations risks two
  # different Flyway versions racing against the same schema_history table.
  # Only started for a fully containerized run (`docker compose --profile full up`).
  # Spring Boot's docker-compose auto-start (spring-boot-docker-compose) only brings up
  # default-profile services, so it starts just "db" - it never launches a second copy
  # of the app in a container while you're already running it locally.
  app:
    container_name: java-application
    profiles: ["full"]
    build: .
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-0}
      # Disco local dos documentos/simulações de CNIS. Fica num volume nomeado
      # (app-storage) para não sumir a cada rebuild da imagem.
      APP_STORAGE_LOCAL_PATH: /app/storage
      # Storage: "local" (padrão) usa o volume acima; "s3" usa o bucket abaixo.
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-sa-east-1}
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-}
      # Credenciais AWS: em EC2 com IAM Role deixe vazias (DefaultCredentialsProvider
      # pega a role da instância). Fora da AWS, preencha no .env.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # CORS: default "*" para teste; troque pelo domínio do frontend em produção.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - app-storage:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  db-data:
  app-storage:
# Stack de observabilidade (opt-in): Prometheus (métricas) + Loki (logs) +
# Tempo (tracing) + Grafana (painéis) + Alloy (coletor de logs dos containers).
#
# Sobe junto do app, na MESMA rede do compose, com:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.observability.yml --profile full up -d --build
#
# NÃO entra no deploy automático (restart-app-docker.sh) de propósito: é pesado
# para uma instância pequena. Ligue sob demanda. Veja docs/OBSERVABILIDADE.md.

services:
  # Liga o tracing no app quando a stack está no ar (o compose base deixa em 0).
  app:
    environment:
      MANAGEMENT_TRACING_SAMPLING: ${MANAGEMENT_TRACING_SAMPLING:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      # PROMETHEUS_SCRAPE_CONFIG escolhe o alvo (não "PROMETHEUS_CONFIG": esse
      # nome é lido pelo client Java do Prometheus dentro do app, que tenta
      # abri-lo como arquivo de propriedades e derruba o boot): prometheus.yml raspa o app em
      # container ("app:8080"); prometheus.ide.yml raspa o app rodando no host,
      # pela IDE ("host.docker.internal:8080"). Um arquivo por modo, e não os
      # dois alvos no mesmo: com o app em container e a porta 8080 publicada, o
      # host.docker.internal também chegaria nele, e cada série contaria em
      # dobro nos painéis (que somam por application).
      - ./observability/prometheus/${PROMETHEUS_SCRAPE_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # host.docker.internal já existe no Docker Desktop; no Linux precisa disto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Só loopback: acesso via Grafana (rede interna) ou túnel SSH.
    ports:
      - "127.0.0.1:9090:9090"
    # required: false - no modo IDE o serviço "app" não sobe (fica no profile
    # "full"), e sem isto o compose recusa o projeto inteiro.
    depends_on:
      app:
        condition: service_started
        required: false

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.7.0
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # OTLP http (4318) publicado só em loopback, para o app rodando pela IDE
    # exportar spans (ver application-dev.yaml). gRPC (4317) e API (3200) ficam
    # só na rede interna do compose.
    ports:
      - "127.0.0.1:4318:4318"

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Socket do Docker (read-only) para ler os logs dos containers. Dá acesso
      # amplo ao daemon - aceitável numa instância dev de dono único.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      # Defina GRAFANA_ADMIN_PASSWORD no .env (o :? falha o up se estiver vazio).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Exposto para você acessar a UI. Abra a porta 3000 no Security Group SÓ
      # para o seu IP - ou, mais seguro, deixe em 127.0.0.1 e use túnel SSH.
      # HTTPS (Caddy/Let's Encrypt) fica para quando planejarmos a instância
      # de produção - ver docs/OBSERVABILIDADE.md.
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:

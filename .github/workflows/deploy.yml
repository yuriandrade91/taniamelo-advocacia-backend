name: Deploy

# Dispara DEPOIS do CI, não em paralelo com ele. Com `push` o deploy subia junto
# com o build e um commit que quebrasse a suíte ia para a instância mesmo assim -
# o pipeline avisava do erro depois de já tê-lo publicado.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy via SSH na instância EC2 (ARM64)
    runs-on: ubuntu-latest
    environment: development
    # workflow_dispatch é a saída manual (rollback, redeploy); pelo gatilho
    # automático, só passa CI verde.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Obter IP do runner
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Abrir porta 22 temporariamente no Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Atualizar e reiniciar o serviço (git pull + mvn package + restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || true
            export PATH=$PATH:/opt/maven/bin:/usr/local/bin
            cd ~/taniamelo-advocacia-backend

            # Atualiza o código
            git fetch origin develop
            git reset --hard origin/develop

            # Builda o projeto, carimbando o SHA que acabou de ser baixado.
            # É o que faz /actuator/info dizer qual versão está rodando aqui.
            #
            # -DskipTests aqui é intencional e não é uma lacuna: a suíte já rodou
            # no CI, que é o gate deste job. Repeti-la na instância exigiria Docker
            # (Testcontainers) num t4g pequeno e só atrasaria o deploy do mesmo
            # commit que acabou de passar.
            mvn -B clean package -DskipTests -Dgit.commit=$(git rev-parse --short HEAD)

            # Reinicia a aplicação
            bash /home/ec2-user/restart-app.sh

            # ── Só agora o deploy pode se dizer concluído ──
            #
            # restart-app.sh devolve o controle assim que DISPARA a aplicação; o
            # boot continua em segundo plano. Migration que quebra é exatamente
            # isso: o Flyway aborta, o contexto do Spring não sobe e o processo
            # morre - e o passo acima já terminou com sucesso. O job ficava verde
            # com a instância fora do ar, que é o pior resultado possível: ninguém
            # vai olhar um pipeline que passou.
            #
            # As migrations rodam no @PostConstruct do MultiTenantFlywayMigrator, a
            # cada boot. Portanto "a aplicação respondeu UP" é, por construção,
            # "as migrations desta versão aplicaram com sucesso".
            ESPERADO=$(git rev-parse --short HEAD)
            echo "Aguardando a aplicação responder (commit esperado: $ESPERADO)..."

            SUBIU=nao
            for _ in $(seq 1 30); do
              # -f faz o curl falhar em 503, que é o que o Spring devolve quando
              # o health está DOWN - não basta responder, tem de responder UP.
              if curl -fsS -m 5 http://localhost:8080/actuator/health > /dev/null 2>&1; then
                SUBIU=sim
                break
              fi
              sleep 4
            done

            if [ "$SUBIU" != "sim" ]; then
              echo "::error::A aplicação não respondeu UP em ~120s. Deploy considerado FALHO."
              echo "--- Procurando o motivo (Flyway/Spring) no log da aplicação ---"
              for LOG in ~/app.log ~/taniamelo-advocacia-backend/app.log /var/log/law-firm.log; do
                [ -f "$LOG" ] && { echo "== $LOG =="; tail -n 80 "$LOG"; break; }
              done
              exit 1
            fi

            # A instância respondeu - mas é a versão que acabou de ser publicada?
            # Sem esta checagem, um restart que não pegou o jar novo passa como
            # deploy bem-sucedido e a investigação começa pelo lugar errado.
            RODANDO=$(curl -fsS -m 5 http://localhost:8080/actuator/info \
              | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')

            if [ "$RODANDO" != "$ESPERADO" ]; then
              echo "::error::A instância está rodando '$RODANDO', mas este deploy publicou '$ESPERADO'."
              exit 1
            fi

            echo "✅ Deploy concluído: $ESPERADO no ar, health UP, migrations aplicadas."

      - name: Fechar porta 22 no Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

name: Deploy

# Deploy contínuo na instância EC2 ARM64 (tm-adv-backend / Amazon Linux 2023),
# que roda o JAR direto na JVM via systemd - SEM Docker. Dispara em push na
# develop (a branch que a instância segue) ou manualmente.
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy via SSH na instância EC2 (ARM64 / systemd)
    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Obter IP do runner
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Abrir porta 22 temporariamente no Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Atualizar e reiniciar o serviço (git pull + mvn package + systemctl restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || true
            source ~/.bash_profile 2>/dev/null || true
            cd ~/taniamelo-advocacia-backend
            git fetch origin develop
            git reset --hard origin/develop
            mvn -B clean package -DskipTests
            sudo systemctl restart law-firm
            sleep 5
            sudo systemctl status law-firm --no-pager

      - name: Fechar porta 22 no Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

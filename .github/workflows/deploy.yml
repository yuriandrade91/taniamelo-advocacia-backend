name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy via SSH na instância EC2 (ARM64)
    runs-on: ubuntu-latest
    environment: development

    steps:

      - name: Obter IP do runner
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Abrir porta 22 temporariamente no Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

            - name: Atualizar e reiniciar o serviço (git pull + mvn package + nohup)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || true
            source ~/.bash_profile 2>/dev/null || true
            cd ~/taniamelo-advocacia-backend

            # Atualiza o código
            git fetch origin develop
            git reset --hard origin/develop

            # Builda o projeto
            mvn -B clean package -DskipTests

            # Para a aplicação se estiver rodando (sem matar a sessão SSH)
            APP_PID=$(pgrep -f "law-firm-0.0.1-SNAPSHOT.jar") || true
            if [ -n "$APP_PID" ]; then
              kill $APP_PID || true
              sleep 3
            fi

            # Inicia a aplicação em background desvinculada da sessão SSH
            nohup /usr/lib/jvm/java-25-amazon-corretto.aarch64/bin/java \
              -jar /home/ec2-user/taniamelo-advocacia-backend/target/law-firm-0.0.1-SNAPSHOT.jar \
              > /home/ec2-user/app.log 2>&1 &
            disown

            sleep 8

            # Verifica se subiu
            if ss -tlnp | grep -q 8080; then
              echo "✅ Aplicação rodando na porta 8080!"
            else
              echo "⚠️ Aplicação ainda iniciando, verifique app.log"
              tail -30 /home/ec2-user/app.log
            fi

      - name: Fechar porta 22 no Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          
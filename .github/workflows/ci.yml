name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build e checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Roda a suíte inteira. Os testes de contexto sobem um Postgres via
      # Testcontainers (ver PostgresContainerConfig); o runner ubuntu-latest já
      # traz o Docker daemon, então não é preciso serviço Postgres no job.
      - name: mvn clean verify
        run: mvn -B clean verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  semgrep:
    name: Semgrep (segurança / padrão de código)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rodar Semgrep
        # Falha o job só em achado de severidade ERROR; achados menores (WARNING/INFO)
        # aparecem no log do job sem bloquear o PR (comportamento padrão da action).
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build (sem push - só valida o Dockerfile)
        run: docker build -t law-firm:ci .

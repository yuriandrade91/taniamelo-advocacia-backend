name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build e checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Roda a suíte inteira. Os testes de contexto sobem um Postgres via
      # Testcontainers (ver PostgresContainerConfig); o runner ubuntu-latest já
      # traz o Docker daemon, então não é preciso serviço Postgres no job.
      - name: mvn clean verify
        run: mvn -B clean verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  sonar:
    name: SonarCloud (análise + Quality Gate)
    runs-on: ubuntu-latest
    # Só roda com o token configurado (não roda em forks/PRs externos, que não
    # têm acesso ao secret). Rode uma vez em SonarCloud para criar o projeto.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o Sonar usa o blame para "new code" e autores.
          fetch-depth: 0

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify + sonar (falha se o Quality Gate reprovar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN ausente - pulando análise Sonar. Configure o secret para ativar o Quality Gate."
            exit 0
          fi
          mvn -B clean verify sonar:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}" \
            -Dsonar.qualitygate.wait=true

  semgrep:
    name: Semgrep (segurança / padrão de código)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rodar Semgrep
        # Falha o job só em achado de severidade ERROR; achados menores (WARNING/INFO)
        # aparecem no log do job sem bloquear o PR (comportamento padrão da action).
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build (sem push - só valida o Dockerfile)
        run: docker build -t law-firm:ci .

version: "3.8"

services:
  db:
    # keep data on a named volume (already declared in base compose) and add a robust healthcheck
    #
    # Corrigido: usava ${DB_USER:-login}/${DB_NAME:-system}, nomes de variável
    # que não existem em lugar nenhum do projeto (o resto do compose usa
    # POSTGRES_USER/POSTGRES_DB, que são as env vars reais da imagem postgres).
    # Sem essa correção, o healthcheck testava sempre "pg_isready -U login -d
    # system" contra um banco criado com outro usuário/nome - ficava
    # eternamente unhealthy e o "app" nunca subia (depends_on: service_healthy).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  app:
    # map a local logs folder so you can inspect application logs from the host
    volumes:
      - ./logs:/app/logs
      - ./scripts/wait-for-db.sh:/app/wait-for-db.sh:ro
    # Removido: SPRING_CONFIG_LOCATION + mount de application-dev.yaml externo.
    # spring.config.location SUBSTITUI (não soma) os locais padrão de config -
    # com ele setado só pro arquivo de profile, o app perdia application.yaml
    # inteiro (JWT, admin seeder, CORS, storage, lista de schemas dos tenants).
    # application-dev.yaml já é carregado normalmente, empacotado no jar, via
    # SPRING_PROFILES_ACTIVE=dev (definido no docker-compose.yml/.env) - não
    # precisa de mount nem de SPRING_CONFIG_LOCATION pra isso funcionar.

volumes:
  # ensure the logs directory is available as a named volume on demand
  db-data: 
